<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space 3D - پروژه طراحی وب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: #000;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .overlay {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 40px;
            border-radius: 16px;
            text-align: center;
            color: #fff;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .overlay h1 {
            font-size: 22px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .overlay p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.8;
        }
        .hint {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
        }
        .loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            z-index: 20;
            text-align: center;
        }
        .loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>در حال ساخت فضا...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="hint">🖱️ با ماوس بچرخون | 🔍 با اسکرول زوم کن</div>

    <div class="overlay">
        <h1>🌌 فضای سه‌بعدی</h1>
        <p>پروژه طراحی وب — ساخته شده با Three.js</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== Setup Scene =====
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            2000
        );
        camera.position.set(0, 20, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // ===== Sun =====
        const sunGeometry = new THREE.SphereGeometry(5, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Sun glow
        const glowGeometry = new THREE.SphereGeometry(6, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({
            color: 0xffaa00,
            transparent: true,
            opacity: 0.2
        });
        const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(sunGlow);

        // Sun light
        const sunLight = new THREE.PointLight(0xffffff, 2, 0, 1);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x404040, 1));

        // ===== Planets =====
        const planetsData = [
            { name: 'Mercury', color: 0xaaaaaa, size: 0.8, distance: 10, speed: 0.02 },
            { name: 'Venus',   color: 0xffcc88, size: 1.2, distance: 14, speed: 0.015 },
            { name: 'Earth',   color: 0x3399ff, size: 1.4, distance: 19, speed: 0.012 },
            { name: 'Mars',    color: 0xff5533, size: 1.0, distance: 24, speed: 0.01 },
            { name: 'Jupiter', color: 0xffaa66, size: 2.5, distance: 32, speed: 0.007 },
            { name: 'Saturn',  color: 0xeedd99, size: 2.0, distance: 40, speed: 0.005 },
            { name: 'Uranus',  color: 0x66ddff, size: 1.6, distance: 47, speed: 0.003 },
            { name: 'Neptune', color: 0x4466ff, size: 1.6, distance: 54, speed: 0.002 }
        ];

        const planets = [];

        planetsData.forEach(data => {
            const geometry = new THREE.SphereGeometry(data.size, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: data.color,
                roughness: 0.7,
                metalness: 0.3
            });
            const planet = new THREE.Mesh(geometry, material);
            planet.userData = {
                distance: data.distance,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2
            };
            scene.add(planet);
            planets.push(planet);

            // Orbit ring
            const ringGeometry = new THREE.RingGeometry(
                data.distance - 0.05, data.distance + 0.05, 128
            );
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.08
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = Math.PI / 2;
            scene.add(ring);

            // Saturn's special ring
            if (data.name === 'Saturn') {
                const saturnRingGeo = new THREE.RingGeometry(
                    data.size + 0.5, data.size + 1.5, 64
                );
                const saturnRingMat = new THREE.MeshBasicMaterial({
                    color: 0xeedd99,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.6
                });
                const saturnRing = new THREE.Mesh(saturnRingGeo, saturnRingMat);
                saturnRing.rotation.x = Math.PI / 2.2;
                planet.add(saturnRing);
            }
        });

        // ===== Stars =====
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starsPositions = new Float32Array(starsCount * 3);
        const starsColors = new Float32Array(starsCount * 3);

        for (let i = 0; i < starsCount * 3; i += 3) {
            const radius = 200 + Math.random() * 600;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            starsPositions[i]     = radius * Math.sin(phi) * Math.cos(theta);
            starsPositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
            starsPositions[i + 2] = radius * Math.cos(phi);

            // Star color variation
            const colorChoice = Math.random();
            if (colorChoice < 0.7) {
                starsColors[i] = 1; starsColors[i+1] = 1; starsColors[i+2] = 1;
            } else if (colorChoice < 0.85) {
                starsColors[i] = 0.7; starsColors[i+1] = 0.8; starsColors[i+2] = 1;
            } else {
                starsColors[i] = 1; starsColors[i+1] = 0.9; starsColors[i+2] = 0.7;
            }
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));

        const starsMaterial = new THREE.PointsMaterial({
            size: 1.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // ===== Mouse controls =====
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;
        });

        // Scroll zoom
        let zoom = 60;
        document.addEventListener('wheel', (e) => {
            zoom += e.deltaY * 0.05;
            zoom = Math.max(15, Math.min(150, zoom));
        });

        // ===== Animation =====
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Rotate stars slowly
            stars.rotation.y += 0.0001;
            stars.rotation.x += 0.00005;

            // Sun pulsing
            const pulse = 1 + Math.sin(time * 2) * 0.03;
            sun.scale.set(pulse, pulse, pulse);
            sunGlow.scale.set(pulse, pulse, pulse);

            // Sun rotation
            sun.rotation.y += 0.002;

            // Planets orbit
            planets.forEach(planet => {
                planet.userData.angle += planet.userData.speed * 0.01;
                planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
                planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
                planet.rotation.y += 0.02;
            });

            // Camera smooth follow mouse
            targetX += (mouseX * 8 - targetX) * 0.05;
            targetY += (-mouseY * 8 - targetY) * 0.05;

            camera.position.x = targetX;
            camera.position.y = 20 + targetY;
            camera.position.z = zoom;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
        }

        // ===== Resize =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== Hide loading =====
        setTimeout(() => {
            document.getElementById('loading').style.display = 'none';
        }, 800);

        animate();
    </script>
</body>
</html>س
