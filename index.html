<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروژه طراحی وب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #fff;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            text-align: center;
            max-width: 420px;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 16px; }
        p { color: #666; line-height: 2; font-size: 15px; }
        .badge {
            display: inline-block;
            background: #10b981;
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            margin-top: 20px;
        }
        .time { color: #aaa; font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ سایت با موفقیت باز شد</h1>
        <p>اگر این صفحه را از سیستم دانشگاه می‌بینی، یعنی GitHub Pages برای تحویل پروژه قابل استفاده است.</p>
        <div class="badge">اتصال برقرار است</div>
        <div class="time" id="time"></div>
    </div>
    <script>
        document.getElementById('time').textContent =
            'زمان بارگذاری: ' + new Date().toLocaleString('fa-IR');
    </script>
</body>
</html>
